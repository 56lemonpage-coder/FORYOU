body{
  background-color:var(--bg);
  background-image:linear-gradient(180deg,var(--sky) 0,var(--bg) 560px);
  background-repeat:no-repeat;
  color:var(--ink);
  font:16px/1.6 var(--serif);
  min-height:100%;
  padding-block:44px 64px;

h1,h2,p{margin:0}

.btn:hover{border-color:var(--ink)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

  position:relative;padding:26px clamp(18px,5vw,34px) 22px;border-radius:4px;color:var(--paper-ink);

.ed-title{font:700 24px/1.3 var(--serif)}

  border:0;border-bottom:1px solid var(--paper-edge);border-radius:0;padding:6px 2px;min-width:0;

  font:400 27px/1.6 var(--hand);color:var(--paper-ink);min-height:300px;resize:vertical;

.editor .btn:hover{border-color:var(--paper-ink)}
.editor .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

    var d = draft || existing || {};
    var fTitle = h('input', { id: 'f-title', type: 'text', maxlength: '60', autocomplete: 'off', placeholder: '편지 제목' });
    var fFrom = h('input', { id: 'f-from', type: 'text', maxlength: '30', autocomplete: 'off', placeholder: '비워 둘 수 있어요' });
    var fBody = h('textarea', { id: 'f-body', maxlength: '5000', rows: '10', placeholder: '여기에 편지를 적어 주세요.' });
    fTitle.value = d.title || '';
    fFrom.value = d.from || '';
    fBody.value = d.body || '';
    var startT = fTitle.value, startF = fFrom.value, startB = fBody.value;
    var status = h('p', { class: 'status', role: 'status' });
    if (notice) status.textContent = notice;
    var saveBtn = h('button', { class: 'btn primary', type: 'submit', text: '저장' });
    var cancelBtn = h('button', { class: 'btn', type: 'button', text: '취소', onclick: function () { closeVeil(); } });
    var ui = statusUI(status, [saveBtn, cancelBtn, fTitle, fFrom, fBody]);

    var form = h('form', { class: 'editor', novalidate: 'novalidate' }, [
      h('h2', { class: 'ed-title', text: existing ? '편지 고치기' : '새 편지' }),
      h('p', { class: 'hint', text: '저장하면 이 주소를 아는 누구나 읽을 수 있어요.' }),
      h('div', { class: 'row2' }, [field('f-title', '제목', fTitle), field('f-from', '보내는 사람', fFrom)]),
      field('f-body', '편지 내용', fBody),
      h('div', { class: 'ed-actions' }, [status, cancelBtn, saveBtn])
    ]);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var t = fTitle.value.trim();
      var f = fFrom.value.trim();
      var b = fBody.value.replace(/\s+$/, '');
      if (!b.trim()) { ui.error('편지 내용을 적어 주세요.'); fBody.focus(); return; }
      if (!t) t = Array.from(b.trim().split('\n')[0]).slice(0, 14).join('');
      var next = cloneState(), id;
      if (existing) {
        var tgt = next.letters.filter(function (l) { return l.id === existing.id; })[0];
        if (!tgt) { ui.error('고치려던 편지를 찾지 못했어요. 페이지를 새로 고침해 주세요.'); return; }
        tgt.title = t; tgt.from = f; tgt.body = b;
        id = existing.id;
      } else {
        id = newId();
        next.letters.unshift({ id: id, title: t, from: f, body: b });
      }
      commit(next, { id: id, editId: existing ? existing.id : null, title: t, from: f, body: b }, ui);
    });

    var veil = h('div', { class: 'veil', role: 'dialog', 'aria-modal': 'true', 'aria-label': existing ? '편지 고치기' : '새 편지' }, [
      h('div', { class: 'veil-in' }, [form])
    ]);
    mountVeil(veil, function () {
      return fTitle.value === startT && fFrom.value === startF && fBody.value === startB;
    }, fTitle);
  }

  function openTitleEditor() {
    closeVeil(true);
    lastFocus = document.activeElement;
    var fSite = h('input', { id: 'f-site-title', type: 'text', maxlength: '40', autocomplete: 'off', placeholder: '사이트 제목' });
    fSite.value = state.title || '';
    var start = fSite.value;
    var status = h('p', { class: 'status', role: 'status' });
    var saveBtn = h('button', { class: 'btn primary', type: 'submit', text: '저장' });
    var cancelBtn = h('button', { class: 'btn', type: 'button', text: '취소', onclick: function () { closeVeil(); } });
    var ui = statusUI(status, [saveBtn, cancelBtn, fSite]);
    var form = h('form', { class: 'editor', novalidate: 'novalidate' }, [
      h('h2', { class: 'ed-title', text: '사이트 제목' }),
      h('p', { class: 'hint', text: '편지 위에 크게 보이는 제목이에요. 비워 두면 제목이 보이지 않아요.' }),
      field('f-site-title', '제목', fSite),
      h('div', { class: 'ed-actions' }, [status, cancelBtn, saveBtn])
    ]);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var next = cloneState();
      next.title = fSite.value.trim();
      commit(next, null, ui);
    });
    var veil = h('div', { class: 'veil', role: 'dialog', 'aria-modal': 'true', 'aria-label': '사이트 제목' }, [
      h('div', { class: 'veil-in' }, [form])
    ]);
    mountVeil(veil, function () { return fSite.value === start; }, fSite);
  }

  /* ---------- 저장 ---------- */
  function buildDoc(next) {
    var reset = RESET_FALLBACK;
    var styles = document.head.querySelectorAll('style');
    for (var i = 0; i < styles.length; i++) {
      var t = styles[i].textContent || '';
      if (t.indexOf('safe-area-inset') > -1 && t.indexOf('[hidden]') > -1) { reset = t; break; }
    }
    var css = document.getElementById('app-style').textContent;
    var js = document.getElementById('app-js').textContent;
    var data = JSON.stringify(next).replace(/</g, '\\u003c')
      .split(String.fromCharCode(8232)).join('\\u2028')
      .split(String.fromCharCode(8233)).join('\\u2029');
    var pageTitle = String(next.title || '').trim() || DEFAULT_TITLE;
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' +
      reset + '</style></head><body>' +
      '<title>' + esc(pageTitle) + '</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="stylesheet" href="' + FONT_HREF + '">' +
      '<style id="app-style">' + css + '</style>' +
      '<div id="root"></div>' +
      '<script type="application/json" id="letters-data">' + data + '<\/script>' +
      '<script id="app-js">' + js + '<\/script>' +
      '</body></html>';
  }

  function errorMessage(code) {
    switch (code) {
      case 'not_writer': case 'not_granted': case 'consent_required': case 'not_declared':
      case 'capability_disabled': case 'capability_removed':
        return '이 페이지는 읽기 전용이라 저장할 수 없어요.';
      case 'too_large': return '편지가 너무 많거나 길어서 저장할 수 없어요. 오래된 편지를 지워 주세요.';
      case 'rate_limited': return '저장 요청이 잠시 몰렸어요. 조금 뒤에 다시 눌러 주세요.';
      default: return '저장하지 못했어요. 잠시 뒤에 다시 시도해 주세요.';
    }
  }

  function commit(next, draft, ui) {
    if (!artifactNS) { ui.error('저장 기능을 불러오지 못했어요. 페이지를 새로 고침해 주세요.'); return; }
    var html;
    try { html = buildDoc(next); }
    catch (e) { ui.error('저장할 페이지를 만들지 못했어요.'); return; }
    if (draft) { try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); } catch (e) {} }
    ui.busy(true, '저장하는 중…');
    var p;
    try { p = artifactNS.publish(html); }
    catch (e) { p = Promise.reject(e); }
    p.then(function () {
      ui.busy(true, '저장했어요. 새로 불러오는 중…');
    }, function (err) {
      var code = err && err.code;
      if (code === 'conflict') {
        ui.busy(true, '다른 곳에서 먼저 저장됐어요. 최신 내용으로 다시 불러옵니다.');
        return;
      }
      try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) {}
      ui.error(errorMessage(code));
    });
  }

  function restoreDraft() {
    if (!editing()) return;
    var raw;
    try { raw = sessionStorage.getItem(DRAFT_KEY); } catch (e) { return; }
    if (!raw) return;
    try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) {}
    var d;
    try { d = JSON.parse(raw); } catch (e) { return; }
    if (!d || typeof d.body !== 'string') return;
    var saved = state.letters.some(function (l) {
      return l.id === d.id && l.body === d.body && l.title === d.title && (l.from || '') === (d.from || '');
    });
    if (saved) return;
    var existing = d.editId ? state.letters.filter(function (l) { return l.id === d.editId; })[0] : null;
    openEditor(existing || null, d, '다른 곳에서 먼저 저장돼 최신 내용으로 다시 불러왔어요. 쓰던 내용을 이어서 저장할 수 있어요.');
  }

  /* ---------- 시작 ---------- */
  render();

  function initCapabilities() {
    var api = window.claude;
    if (!api || typeof api.use !== 'function') return;
    var userNS = null;
    Promise.resolve()
      .then(function () { return api.use('artifact'); })
      .then(function (a) { artifactNS = a || null; return api.use('user'); })
      .then(function (u) { userNS = u || null; })
      .catch(function () {})
      .then(function () {
        if (!artifactNS || !userNS) return false;
        return Promise.resolve(userNS.canEdit()).catch(function () { return false; });
      })
      .then(function (ok) {
        canWrite = !!ok;
        if (canWrite) { renderAll(); restoreDraft(); }
      });
  }
  initCapabilities();
})();
</script></body></html>

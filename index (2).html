<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>편지함</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Gowun+Batang:wght@400;700&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#e6d3a0}
body{margin:0}
[hidden]{display:none!important}
/* Layout: 누렇게 바랜 양피지 바탕에 갈색 끈 한 줄. 끈마다 양피지 두루마리가 매달려 있고, 누르면 끈이 풀리며 펼쳐진다. */
:root{
  color-scheme:light;
  --bg:#e6d3a0; --sky:#f0e2b8; --ink:#3a2814; --ink-soft:#6b5532;
  --thread:#8a6a3c; --accent:#6b3f1d; --on-accent:#f6ead0;
  --paper:#f2e2b4; --paper-cap:#d9bf82; --paper-ink:#33230f; --paper-ink-soft:#6b5532; --paper-edge:#b8995f; --paper-err:#9c2f1d;
  --wood:#6b4a2a; --wood-hi:#8c6238; --twine:#8a5a2b;
  --err:#9c2f1d; --veil:rgba(52,36,18,.9); --veil-ink:#f3e4b8; --veil-soft:#d9c18a; --veil-err:#ffb199;
  --shadow:rgba(70,45,15,.38); --focus:#7a3b12;
  --serif:"Gowun Batang","Nanum Myeongjo","Noto Serif KR","Apple SD Gothic Neo","Malgun Gothic",serif;
  --hand:"Nanum Pen Script","Apple SD Gothic Neo","Malgun Gothic",cursive,sans-serif;
  --parch:radial-gradient(ellipse at 50% 40%,#f6e9c1 0,#f0dfae 62%,#e3c98c 100%);
}

body{
  background-color:var(--bg);
  background-image:linear-gradient(180deg,var(--sky) 0,var(--bg) 560px);
  background-repeat:no-repeat;
  color:var(--ink);
  font:16px/1.6 var(--serif);
  min-height:100%;
  padding-block:44px 64px;
}
body.locked{overflow:hidden}
h1,h2,p{margin:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}

.bleed{
  padding-left:max(16px,env(safe-area-inset-left,0px),calc((100% - 1040px)/2));
  padding-right:max(16px,env(safe-area-inset-right,0px),calc((100% - 1040px)/2));
}

.head{text-align:center;padding-bottom:34px}
.head:empty{display:none}
h1{font:700 clamp(30px,6.5vw,44px)/1.25 var(--serif);letter-spacing:.02em;text-wrap:balance}
.orn{width:min(220px,50%);height:1px;margin:16px auto 0;background:linear-gradient(90deg,transparent,var(--thread),transparent)}

.bar{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:26px;text-align:center}
.bar:empty{display:none}
.owner-note{font-size:13px;color:var(--ink-soft);max-width:44ch}
.bar-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.bar-status{font-size:14px;color:var(--ink-soft)}
.bar-status.err{color:var(--err)}
.bar-status:empty{display:none}

.btn{
  font:700 15px/1.2 var(--serif);padding:10px 18px;border-radius:999px;
  border:1px solid var(--thread);background:transparent;color:var(--ink);cursor:pointer;
}
.btn:hover{border-color:var(--ink)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.back-edit{position:fixed;z-index:40;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--sky)}

/* 편지 선반: 줄마다 끈 한 가닥 */
.shelf{
  list-style:none;margin:0 0 40px;padding-block:0;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));grid-auto-rows:190px;
  background:linear-gradient(to bottom,var(--thread) 0,var(--thread) 1.5px,transparent 1.5px) 0 0/100% 190px repeat-y;
}
.shelf li{min-width:0}
.note{
  display:flex;flex-direction:column;align-items:center;width:100%;height:100%;
  padding:0 6px;border:0;background:none;color:inherit;font:inherit;text-align:center;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.note:focus-visible{outline-offset:-3px;border-radius:6px}
.note svg{width:100%;max-width:190px;height:auto;overflow:visible;flex:none;filter:drop-shadow(0 4px 5px var(--shadow));transition:filter .3s ease}
.note:hover svg,.note:focus-visible svg{filter:drop-shadow(0 7px 9px var(--shadow))}
.note-title{
  margin-top:6px;font:700 17px/1.35 var(--serif);max-width:100%;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;
}
.str{fill:none;stroke:var(--thread);stroke-width:1.4;stroke-linecap:round}
.knot{fill:var(--thread)}
.tube-body{fill:var(--paper);stroke:var(--paper-edge);stroke-width:1}
.cap{fill:var(--paper-cap);stroke:var(--paper-edge);stroke-width:1}
.wrap{fill:var(--twine)}
.hang{transform-origin:100px 0;transform:rotate(var(--tilt,0deg))}
.note:hover .hang,.note:focus-visible .hang{animation:sway 2.6s ease-in-out infinite}
@keyframes sway{
  0%,100%{transform:rotate(calc(var(--tilt,0deg) - 2.4deg))}
  50%{transform:rotate(calc(var(--tilt,0deg) + 2.4deg))}
}

.empty{padding-top:10px;padding-bottom:40px;text-align:center;color:var(--ink-soft)}
.empty h2{font:700 20px/1.4 var(--serif);color:var(--ink)}
.empty p{margin-top:6px}

/* 펼친 편지 */
.veil{
  position:fixed;inset:0;z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow:auto;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:var(--veil);color:var(--veil-ink);opacity:0;transition:opacity .5s ease;overscroll-behavior:contain;
}
.veil.show{opacity:1}
.veil :focus-visible{outline-color:var(--veil-ink)}
.veil .btn{color:var(--veil-ink);border-color:var(--veil-soft)}
.veil .btn:hover{border-color:var(--veil-ink)}
.veil .btn.danger{background:var(--veil-ink);border-color:var(--veil-ink);color:var(--paper-ink)}
.veil-in{margin-block:auto;width:min(580px,100%)}
.veil-top{display:flex;justify-content:flex-end;margin-bottom:14px}

.scroll{width:100%;filter:drop-shadow(0 12px 22px rgba(20,10,0,.5))}
.dowel{position:relative;height:20px;margin-inline:-6px;border-radius:10px;z-index:2;background:var(--wood)}
.dowel::before,.dowel::after{content:"";position:absolute;top:-3px;width:16px;height:26px;border-radius:8px;background:var(--wood-hi)}
.dowel::before{left:-8px}
.dowel::after{right:-8px}
.tie{
  position:absolute;left:50%;top:-4px;width:16px;height:28px;margin-left:-8px;border-radius:3px;
  background:var(--twine);transition:transform .6s ease,opacity .6s ease;z-index:3;
}
.tie::after{
  content:"";position:absolute;left:6px;top:26px;width:2px;height:24px;background:var(--twine);
  transform:rotate(14deg);transform-origin:top center;
}
.scroll.open .tie{transform:translateY(30px) rotate(20deg);opacity:0}

.sheet{display:grid;grid-template-rows:0fr;margin-inline:4px;transition:grid-template-rows .7s ease}
.scroll.open .sheet{grid-template-rows:1fr;transition:grid-template-rows 1.1s cubic-bezier(.45,.05,.2,1) .25s}
.clip{min-height:0;overflow:hidden}
.paper-body{
  max-height:min(60vh,540px);overflow:auto;color:var(--paper-ink);
  background:var(--parch);box-shadow:inset 0 0 38px rgba(120,80,20,.3);
  padding:34px clamp(20px,6vw,44px) 38px;
}
.paper-body:focus-visible{outline-offset:-4px;outline-color:var(--focus)}
.l-title{font:700 clamp(23px,5vw,28px)/1.35 var(--serif);text-wrap:balance;margin-bottom:20px}
.l-text{font:400 clamp(26px,5.6vw,30px)/1.65 var(--hand);white-space:pre-wrap;overflow-wrap:anywhere}
.l-sign{margin-top:26px;text-align:right;font:400 clamp(26px,5.6vw,30px)/1.4 var(--hand);overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:20px}
.veil-in>.status{margin-top:10px;text-align:center;font-size:14px;color:var(--veil-soft);min-height:1.5em}
.veil-in>.status.err{color:var(--veil-err)}

/* 쓰기 */
.editor{
  position:relative;padding:26px clamp(18px,5vw,34px) 22px;border-radius:4px;color:var(--paper-ink);
  background:var(--parch);box-shadow:inset 0 0 38px rgba(120,80,20,.3),0 12px 22px rgba(20,10,0,.45);
}
.editor :focus-visible{outline-color:var(--focus)}
.ed-title{font:700 24px/1.3 var(--serif)}
.hint{margin-top:4px;font-size:13px;color:var(--paper-ink-soft)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 20px}
.field{display:flex;flex-direction:column;gap:4px;margin-top:16px;min-width:0}
.field label{font-size:13px;color:var(--paper-ink-soft)}
.field input{
  font:700 19px/1.4 var(--serif);color:var(--paper-ink);background:transparent;
  border:0;border-bottom:1px solid var(--paper-edge);border-radius:0;padding:6px 2px;min-width:0;
}
.field textarea{
  font:400 27px/1.6 var(--hand);color:var(--paper-ink);min-height:300px;resize:vertical;
  border:1px solid var(--paper-edge);border-radius:3px;padding:8px 10px;background:transparent;
}
.field input::placeholder,.field textarea::placeholder{color:var(--paper-ink-soft);opacity:.75}
.ed-actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:10px;margin-top:18px}
.ed-actions .status{flex:1 1 220px;margin:0;font-size:14px;color:var(--paper-ink-soft);min-height:1.5em}
.editor .status.err{color:var(--paper-err)}
.editor .btn{color:var(--paper-ink);border-color:var(--paper-edge)}
.editor .btn:hover{border-color:var(--paper-ink)}
.editor .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}
}

</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  'use strict';

  var root = document.getElementById('root');
  var openVeil = null;
  var lastFocus = null;

  function reduceMotion() { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
  function tiltOf(id) {
    var n = 0, i;
    for (i = 0; i < id.length; i++) n = (n * 31 + id.charCodeAt(i)) | 0;
    return (Math.abs(n) % 50 / 10 - 2.5).toFixed(1);
  }
  function h(tag, props, kids) {
    var el = document.createElement(tag), k, v;
    if (props) {
      for (k in props) {
        v = props[k];
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : v);
      }
    }
    (kids || []).forEach(function (c) {
      if (c == null) return;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return el;
  }
  function svgFrom(markup) {
    var t = document.createElement('div');
    t.innerHTML = markup;
    return t.firstElementChild;
  }
  function tubeSVG(tilt) {
    return '<svg viewBox="0 0 200 118" aria-hidden="true" focusable="false">' +
      '<g class="hang" style="--tilt:' + tilt + 'deg">' +
      '<path class="str" d="M100 0L48 46M100 0L152 46"/>' +
      '<circle class="knot" cx="100" cy="1.5" r="3"/>' +
      '<rect class="tube-body" x="30" y="46" width="140" height="28" rx="14"/>' +
      '<ellipse class="cap" cx="162" cy="60" rx="5" ry="11"/>' +
      '<rect class="wrap" x="93" y="44" width="14" height="32" rx="3"/>' +
      '<circle class="knot" cx="100" cy="77" r="3"/>' +
      '<path class="str" d="M100 78C97 90 89 96 83 106M100 78C103 90 111 94 116 104"/>' +
      '</g></svg>';
  }

  /* letters.txt 읽기 */
  function parse(text) {
    text = String(text).replace(/^﻿/, '').replace(/\r\n?/g, '\n');
    var parts = text.split(/^={3,}[ \t]*$/m);
    var head = parts.shift() || '';
    var title = '';
    head.split('\n').forEach(function (line) {
      var m = line.match(/^사이트 제목\s*[:：]\s*(.*)$/);
      if (m) title = m[1].trim();
    });
    var letters = [];
    parts.forEach(function (block, i) {
      var lines = block.replace(/^\n+/, '').split('\n');
      var t = '', f = '', idx = 0, m;
      while (idx < lines.length) {
        m = lines[idx].match(/^(제목|보낸이)\s*[:：]\s*(.*)$/);
        if (!m) break;
        if (m[1] === '제목') t = m[2].trim(); else f = m[2].trim();
        idx++;
      }
      var body = lines.slice(idx).join('\n').replace(/^\n+/, '').replace(/\s+$/, '');
      if (body) letters.push({ id: 'l' + i, title: t || '제목 없는 편지', from: f, body: body });
    });
    return { title: title, letters: letters };
  }

  /* 화면 */
  function renderPage(data) {
    root.textContent = '';
    var t = (data.title || '').trim();
    document.title = t || '편지함';
    var head = h('header', { class: 'head bleed' });
    if (t) {
      head.appendChild(h('h1', { text: t }));
      head.appendChild(h('div', { class: 'orn', 'aria-hidden': 'true' }));
    }
    root.appendChild(head);
    if (!data.letters.length) {
      root.appendChild(h('div', { class: 'empty bleed' }, [
        h('h2', { text: '아직 걸린 편지가 없어요' }),
        h('p', { text: '곧 편지가 도착할 거예요.' })
      ]));
      return;
    }
    var ul = h('ul', { class: 'shelf bleed' });
    data.letters.forEach(function (l) {
      var btn = h('button', {
        class: 'note', type: 'button', 'aria-label': '편지 열기: ' + l.title,
        onclick: function () { openLetter(l, btn); }
      });
      btn.appendChild(svgFrom(tubeSVG(tiltOf(l.id))));
      btn.appendChild(h('span', { class: 'note-title', text: l.title }));
      ul.appendChild(h('li', null, [btn]));
    });
    root.appendChild(h('main', null, [ul]));
  }

  function onKey(e) {
    if (!openVeil) return;
    if (e.key === 'Escape') { e.preventDefault(); closeVeil(); return; }
    if (e.key === 'Tab') {
      var nodes = openVeil.querySelectorAll('button,[tabindex="0"]');
      var f = Array.prototype.filter.call(nodes, function (x) { return !x.disabled && x.offsetParent !== null; });
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (!openVeil.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
      else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }
  function closeVeil(immediate) {
    var v = openVeil;
    if (!v) return;
    openVeil = null;
    document.removeEventListener('keydown', onKey, true);
    document.body.classList.remove('locked');
    function done() { if (v.parentNode) v.parentNode.removeChild(v); }
    if (immediate || reduceMotion()) {
      done();
    } else {
      var s = v.querySelector('.scroll');
      if (s) s.classList.remove('open');
      v.classList.remove('show');
      setTimeout(done, 700);
    }
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus({ preventScroll: true }); } catch (e) {} }
  }
  function openLetter(letter, trigger) {
    closeVeil(true);
    lastFocus = trigger || null;
    var closeBtn = h('button', { class: 'btn', type: 'button', text: '닫기', onclick: function () { closeVeil(); } });
    var paper = h('div', { class: 'paper-body', tabindex: '0' }, [
      h('h2', { class: 'l-title', text: letter.title }),
      h('div', { class: 'l-text', text: letter.body }),
      letter.from ? h('div', { class: 'l-sign', text: letter.from }) : null
    ]);
    var scroll = h('article', { class: 'scroll' }, [
      h('div', { class: 'dowel' }, [h('div', { class: 'tie', 'aria-hidden': 'true' })]),
      h('div', { class: 'sheet' }, [h('div', { class: 'clip' }, [paper])]),
      h('div', { class: 'dowel' })
    ]);
    var veil = h('div', { class: 'veil', role: 'dialog', 'aria-modal': 'true', 'aria-label': '편지: ' + letter.title }, [
      h('div', { class: 'veil-in' }, [h('div', { class: 'veil-top' }, [closeBtn]), scroll])
    ]);
    openVeil = veil;
    document.body.appendChild(veil);
    document.body.classList.add('locked');
    document.addEventListener('keydown', onKey, true);
    veil.addEventListener('click', function (e) { if (e.target === veil) closeVeil(); });
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        veil.classList.add('show');
        scroll.classList.add('open');
        try { closeBtn.focus({ preventScroll: true }); } catch (e) {}
      });
    });
  }

  fetch('letters.txt', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.text(); })
    .then(function (t) { renderPage(parse(t)); })
    .catch(function () {
      root.textContent = '';
      root.appendChild(h('div', { class: 'empty bleed' }, [
        h('h2', { text: '편지를 불러오지 못했어요' }),
        h('p', { text: '잠시 뒤에 다시 열어 주세요.' })
      ]));
    });
})();
</script>
</body>
</html>
